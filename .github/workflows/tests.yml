name: IlCarro UI Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# РАЗРЕШАЕМ РОБОТУ ПИСАТЬ В РЕПОЗИТОРИЙ
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: python -m playwright install --with-deps

      - name: Run Pytest
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          HEADLESS_MODE: "true"
        run: python -m pytest tests_playwright/ --clean-alluredir --alluredir=allure-results
        continue-on-error: true

      - name: Check allure-results contents
        run: ls -la allure-results

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # --- ОТПРАВКА УВЕДОМЛЕНИЯ В ТЕЛЕГРАМ (только 1 раз в конце) ---
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🤖 Автотесты IlCarro завершены!
            📊 Посмотреть Allure-отчет можно по ссылке:
            👉 https://arfami096.github.io/ICarro_New/